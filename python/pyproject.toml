[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorweave"
version = "0.2.0"
description = "Official Python client for the Factor Weave quant data API — factors, similarity search, leak-free labels, derived analytics, MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Factor Weave", email = "support@factorweave.com" }]
maintainers = [{ name = "Blazing Customs", email = "support@factorweave.com" }]
keywords = ["quant", "factor", "vector-similarity", "backtest", "stock", "embeddings", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests>=2.28"]

[project.scripts]
fw = "factorweave.cli:main"

[project.optional-dependencies]
pandas  = ["pandas>=1.5"]
polars  = ["polars>=0.20"]
all     = ["pandas>=1.5", "polars>=0.20"]

[project.urls]
Homepage      = "https://factorweave.com/"
Documentation = "https://factorweave.com/#docs"
Source        = "https://github.com/Blazing-Customs/factorweave-tools/tree/main/python"
Issues        = "https://github.com/Blazing-Customs/factorweave-tools/issues"
Changelog     = "https://github.com/Blazing-Customs/factorweave-tools/releases"
Repository    = "https://github.com/Blazing-Customs/factorweave-tools"
"OpenAPI spec"= "https://factorweave.com/api/openapi.json"

[tool.setuptools.packages.find]
where = ["src"]
